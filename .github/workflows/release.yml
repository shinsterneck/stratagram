# For a version tag (vX.Y.Z): the Build workflow, with all its tests, and
# then a GitHub release with what it made: the Windows installer, the
# Windows zip, the Linux download and the NetBox plugin's package. The
# release notes are the tag's message; a release made by hand beforehand keeps its notes and
# gets the files added. The plugin's package also goes to PyPI
# (netbox-stratagram), by trusted publishing: PyPI accepts it from this
# workflow in the "pypi" environment, without a token.
# Run by hand with a tag (Actions → Release → Run workflow), it only sends
# the plugin's package of that existing GitHub release to PyPI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag whose plugin package goes to PyPI (e.g. v1.0.1)"
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(assets/*-setup.exe assets/*-windows-x64.zip assets/*-linux-x86_64.tar.gz assets/*.whl)
          ls -l "${files[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            # checkout fetches the tag as a plain ref; its message is needed.
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            gh release create "$tag" "${files[@]}" --verify-tag --notes-from-tag --title "Stratagram ${tag#v}"
          fi

  pypi:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/netbox-stratagram/
    permissions:
      contents: read
      id-token: write
    steps:
      - if: github.event_name == 'push'
        uses: actions/download-artifact@v8
        with:
          name: netbox-plugin
          path: dist
      - if: github.event_name == 'workflow_dispatch'
        name: The package from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'netbox_stratagram-*.whl' --dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
