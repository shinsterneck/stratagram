[workspace]
members = [".", "core", "web"]
default-members = [".", "core"]

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "Apache-2.0"
authors = ["Shin Sterneck"]
homepage = "https://stratagram.app/"
repository = "https://github.com/shinsterneck/stratagram"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[package]
name = "stratagram"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
stratagram-core = { path = "core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"

# The icon and version details in stratagram.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# The browser editor: small to download (web/build.sh).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
