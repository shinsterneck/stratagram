[package]
name = "stratagram-web"
description = "Stratagram's editor in the browser (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
stratagram-core = { path = "../core" }
# Must match the wasm-bindgen command line tool exactly (web/build.sh).
wasm-bindgen = "=0.2.129"
# The browser's clock for the "last change" stamp.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
